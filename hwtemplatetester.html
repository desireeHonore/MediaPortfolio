<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Homework #1 – Image Exploration</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f7f7f7;
      font-family: 'VT323', monospace;
      margin: 0 auto;
      max-width: 720px;
      padding: 2rem;
      color: #7C7294;
      line-height: 1.6;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #008B8B;
      text-align: center;
    }

/* Homework Images Styling */
  .homework-images {
              margin: 2rem auto;
              max-width: 800px;
              padding: 0 1rem;
  }

.image-row {
  display: flex;
  gap: 1.5rem;
  justify-content: center;
  flex-wrap: wrap;
}

/* Image + Hover Animation */
.image-row img {
  max-width: 100%;
  width: 300px;
  border-radius: 12px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
  transition: transform 0.4s ease, box-shadow 0.4s ease, filter 0.4s ease;
  cursor: pointer;
}

.image-row img:hover {
  transform: scale(1.05) rotate(0.5deg);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
  filter: brightness(1.1) saturate(1.2);
}

/* Optional Caption Styling */
.image-row figure {
  text-align: center;
  margin: 0;
}

.image-row figcaption {
  margin-top: 0.5rem;
  font-size: 0.9rem;
  color: #7C7294;
  font-style: italic;
}

    .description {
      font-size: 1.2rem;
      margin-top: 2rem;
      padding: 1rem;
      background: #D8BFD8;
      border-radius: 12px;
    }

    a {
      color: #008B8B;
      text-decoration: none;
      font-size:30px
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Homework #1: Image Exploration</h1>

  <!-- Homework Images Section -->
<section class="homework-images">
  <div class="image-row">
    <figure>
      <img src="image1.jpg" alt="A meaningful description of image 1">
      <figcaption>Caption for Image 1</figcaption>
    </figure>
    <figure>
      <img src="image2.jpg" alt="A meaningful description of image 2">
      <figcaption>Caption for Image 2</figcaption>
    </figure>
  </div>
</section>


  <div class="description">
    <p>Write my photo description here</p>
  </div>
  <h1>Go back: <a href="index.html">Link to my portfolio</a></h1>
</body>
</html>

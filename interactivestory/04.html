
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running An Errand</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(to bottom, #faf9f6 0%, #f5f5f0 100%);
            min-height: 100vh;
            padding: 60px 20px;
            color: #2a2a2a;
            line-height: 1.7;
        }

        .container {
            max-width: 740px;
            margin: 0 auto;
            background: #ffffff;
            padding: 70px 60px;
            box-shadow: 0 2px 30px rgba(0, 0, 0, 0.04);
            border: 1px solid #ebe9e4;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 35px;
            border-bottom: 1px solid #e8e6e0;
        }

        .title {
            font-size: 0.85rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #9a9a8a;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .story-text {
            font-size: 1.15rem;
            color: #3a3a3a;
            margin-bottom: 50px;
            font-weight: 300;
            letter-spacing: 0.2px;
            text-align: justify;
        }

        .story-text::first-letter {
            font-size: 3.2rem;
            float: left;
            line-height: 0.85;
            margin: 8px 12px 0 0;
            color: #6a6a5a;
            font-weight: 300;
        }

        .whisper {
            font-style: italic;
            color: #7a7a6a;
            position: relative;
        }

        .whisper::before {
            content: '"';
            opacity: 0.4;
        }

        .whisper::after {
            content: '"';
            opacity: 0.4;
        }

        .image-container {
            margin: 55px -60px 60px -60px;
            position: relative;
            overflow: hidden;
        }

        .image-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, #d8d6d0 50%, transparent);
        }

        .image-container img {
            width: 100%;
            display: block;
            opacity: 0.88;
            filter: grayscale(15%) contrast(1.05);
        }

        .choices {
            padding-top: 45px;
        }

        .choices-label {
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #b5b5a5;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .choice {
            display: block;
            text-decoration: none;
            color: #2a2a2a;
            padding: 32px 24px;
            border: 1px solid #e8e6e0;
            margin-bottom: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #fafaf8;
            position: relative;
        }

        .choice::before {
            content: '→';
            position: absolute;
            left: 24px;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #6a6a5a;
        }

        .choice:hover {
            background: #ffffff;
            border-color: #c8c6c0;
            padding-left: 50px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .choice:hover::before {
            opacity: 1;
            left: 24px;
        }

        .choice h2 {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.3px;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            body {
                padding: 30px 15px;
            }

            .container {
                padding: 45px 30px;
            }

            .image-container {
                margin: 40px -30px 45px -30px;
            }

            .story-text {
                font-size: 1.05rem;
                text-align: left;
            }

            .choice {
                padding: 26px 20px;
            }

            .choice:hover {
                padding-left: 46px;
            }

            .choice h2 {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">Interactive Story</div>
        </div>

        <div class="story-text">
          Viola! You go through the door and find a janitorial closet, you're confused but this must be where the whisper is coming from.The closer you get,
                      the louder the whisper, "Wake Up!"
        </div>

        <div class="image-container">
            <img src="images/img.jpg" alt="Scene" onerror="this.style.display='none'">
        </div>

        <div class="choices">
            <div class="choices-label">What will you do?</div>
            
            <a href="insert link" class="choice">
                <h2>You listen to the voice and wake up</h2>
            </a>
            
            <a href="05.html" class="choice">
                <h2>You keep dreaming</h2>
            </a>
            
         
        </div>
    </div>
</body>
</html>

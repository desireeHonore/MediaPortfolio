<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Story</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f7f7f7;
      font-family: 'VT323', monospace;
      margin: 0 auto;
      max-width: 680px;
      padding: 2rem;
      color: #222;
      line-height: 1.8;
      font-size: 1.4rem;
    }

    p {
      text-indent: 2em;
    }

    h1 {
      font-size: 2.8rem;
      color: #008B8B;
      text-align: center;
      margin-bottom: 2rem;
    }

    blockquote {
      background: #D8BFD8;
      padding: 1rem 1.5rem;
      margin: 2rem 0;
      border-left: 4px solid #008B8B;
      font-style: italic;
    }

    p {
      margin-bottom: 1.5rem;
    }

    strong {
      background: #ffe4f2;
      padding: 0 0.3rem;
      border-radius: 4px;
    }

    a {
      color: #008B8B;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .image-container {
            margin: 55px -60px 60px -60px;
            position: relative;
            overflow: hidden;
        }

    .image-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, #d8d6d0 50%, transparent);
        }

    .image-container img {
            width: 500px;
            display: block;
            opacity: 0.88;
            filter: grayscale(15%) contrast(1.05);
        }
  </style>
</head>
